# Board-specific: PA3 drives DRV_EN on the original motor-control PCB.
# On a debugger halt, immediately clear PA3 using GPIOA_BRR. Firmware detects
# the cleared enable on resume and latches fault 4 instead of restarting.
# This file is specific to this board; do not reuse it as a generic F103 config.
# 本板 PA3 接三个半桥的 DRV_EN。调试器暂停时，下面的 OpenOCD 回调尝试清除 PA3，
# 避免 CPU 停止更新而驱动器继续保持最后一组占空比。实际停机效果仍需硬件验证。
# 固件若在运行阶段恢复后发现 PA3 已低，会锁定 fault=4，复位才重新进行试转。
# 0x40010814 是 STM32F1 的 GPIOA_BRR；0x00000008 的 bit3=1，含义是清除 PA3 输出位。
# 这是本板专用行为，不应直接复制给 PA3 用作其他功能的工程。
$_TARGETNAME configure -event halted {
    # GPIOA may not yet be clocked at the initial main/reset breakpoint.
    if {[catch {mww 0x40010814 0x00000008} motor_stop_error]} {
        echo "Motor-test halt hook could not clear PA3: $motor_stop_error"
    }
}
